<!--
  AirBeam Mini "add to cart" CTA card for blog posts (A/B variant: cart).
  Styles: _sass/modules/_airbeam-mini-cta.scss
-->
<section id="airbeam-mini-cta" class="airbeam-cta">
  <div class="airbeam-cta__card">
    <div class="airbeam-cta__media">
      <img
        src="/assets/img/pages/buy-it-now/airbeam-sleave.png"
        alt="AirBeam Mini air quality monitor"
        loading="lazy"
      />
    </div>

    <div class="airbeam-cta__body">
      <div class="airbeam-cta__text">
        <h3 class="airbeam-cta__name">AirBeam Mini</h3>
        <p class="airbeam-cta__tagline">Monitor the air you actually breathe.</p>
        <p class="airbeam-cta__benefits">Lab-validated · No subscriptions</p>
      </div>

      <div class="airbeam-cta__bottom">
        <div class="airbeam-cta__price">
          <span class="cur">$</span><span class="amt">99</span><span class="code">USD</span>
        </div>

        <button class="product-cta-button" onclick="addToCart('mini', 'AirBeam Mini', 99, '/assets/buy-it-now_ABMsidebyside.jpg')">
          <img src="/assets/img/pages/buy-it-now/airbeam_logo.svg" alt="AirBeam" class="airbeam-logo-icon" />
          <span>Add to Cart</span>
          <svg class="cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="M12 5l7 7-7 7"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
