<!--
  Simplified AirBeam Mini "add to cart" CTA for blog posts.
  Self-contained (own scoped styles), always visible (no reveal-* classes, no
  dependency on scroll-reveal.js), and NOT wrapped in .panel — it already lives
  inside .post-content, so it fills the full article column width.
-->
<style>
  .airbeam-cta { margin: 2.5rem 0; }
  .airbeam-cta * { box-sizing: border-box; }
  .airbeam-cta p { margin: 0; }
  .airbeam-cta__card {
    display: flex;
    flex-direction: column;
    width: 100%;
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 1.25rem;
    overflow: hidden;
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.06);
  }
  .airbeam-cta__media { width: 100%; }
  .airbeam-cta__media img {
    display: block;
    width: 100%;
    height: 220px;
    object-fit: cover;
  }
  .airbeam-cta__body {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding: 1.5rem;
  }
  .airbeam-cta__name {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.15;
    color: #1f2937;
  }
  .airbeam-cta__tagline {
    margin: 0.35rem 0 0;
    font-size: 0.95rem;
    line-height: 1.5;
    color: #6b7280;
  }
  .airbeam-cta__benefits {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.25rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .airbeam-cta__benefit {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.875rem;
    color: #374151;
  }
  .airbeam-cta__benefit svg { width: 18px; height: 18px; flex-shrink: 0; color: #1ea73f; }
  .airbeam-cta__footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-top: 0.25rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(0, 0, 0, 0.06);
  }
  .airbeam-cta__price { line-height: 1; }
  .airbeam-cta__price .cur { font-size: 1.25rem; font-weight: 700; color: #1ea73f; vertical-align: top; }
  .airbeam-cta__price .amt { font-size: 2.5rem; font-weight: 700; color: #1ea73f; letter-spacing: -0.02em; }
  .airbeam-cta__price .code { font-size: 0.9rem; font-weight: 600; color: #1ea73f; }
  .airbeam-cta__price-sub { margin: 0.35rem 0 0; font-size: 0.78rem; color: #9ca3af; }
  .airbeam-cta__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.85rem 1.75rem;
    background: linear-gradient(135deg, #ffe651 0%, #ffd700 100%);
    color: #111827;
    border: none;
    border-radius: 2rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(255, 230, 81, 0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .airbeam-cta__btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(255, 230, 81, 0.45); }
  .airbeam-cta__btn img { width: 20px; height: 20px; display: block; }
  .airbeam-cta__btn svg { width: 18px; height: 18px; }

  @media (min-width: 600px) {
    .airbeam-cta__card { flex-direction: row; align-items: stretch; }
    .airbeam-cta__media { width: 42%; flex-shrink: 0; }
    .airbeam-cta__media img { height: 100%; min-height: 300px; }
    .airbeam-cta__body { flex: 1; justify-content: center; padding: 1.75rem 2rem; }
  }
</style>

<section id="airbeam-mini-cta" class="airbeam-cta">
  <div class="airbeam-cta__card">
    <div class="airbeam-cta__media">
      <img
        data-src="/assets/buy-it-now_ABMsidebyside.jpg?nf_resize=fit&w=1000"
        src="/assets/buy-it-now_ABMsidebyside.jpg?nf_resize=fit&w=200"
        alt="AirBeam Mini air quality monitor"
        class="lazyload"
      />
    </div>

    <div class="airbeam-cta__body">
      <div>
        <h3 class="airbeam-cta__name">AirBeam Mini</h3>
        <p class="airbeam-cta__tagline">See the air you are actually breathing — monitor PM2.5 anywhere you live and breathe.</p>
      </div>

      <ul class="airbeam-cta__benefits">
        <li class="airbeam-cta__benefit">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
          <span>Lab-validated accuracy</span>
        </li>
        <li class="airbeam-cta__benefit">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
          <span>No subscriptions — own your data</span>
        </li>
        <li class="airbeam-cta__benefit">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
          <span>Weatherproof for outdoor use</span>
        </li>
      </ul>

      <div class="airbeam-cta__footer">
        <div>
          <div class="airbeam-cta__price">
            <span class="cur">$</span><span class="amt">99</span> <span class="code">USD</span>
          </div>
          <p class="airbeam-cta__price-sub">~€85 · ~£74 estimate · charged in USD · ships worldwide</p>
        </div>

        <button class="airbeam-cta__btn" onclick="addToCart('mini', 'AirBeam Mini', 99, '/assets/buy-it-now_ABMsidebyside.jpg')">
          <img src="/assets/img/pages/buy-it-now/airbeam_logo.svg" alt="AirBeam" />
          <span>Add to Cart</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>
