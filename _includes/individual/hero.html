{% comment %} Individual LP — Hero. Calm, family-first promise. {% endcomment %}
<section class="panel ilp-hero reveal-section">
  <div class="ilp-hero__container">
    <div class="ilp-hero__content reveal-content">
      <span class="ilp-hero__eyebrow reveal-header">For you and your family</span>
      <h1 class="ilp-hero__title reveal-header">Your air, right now, wherever you are.</h1>
      <p class="ilp-hero__subtitle reveal-body">
        A palm-sized sensor that shows what you and your family are actually breathing, wherever you go — so you can make simple, everyday choices.
      </p>
      <div class="ilp-hero__ctas reveal-body">
        <button
          class="ilp-hero__demo"
          onclick="document.getElementById('videos-section')?.scrollIntoView({ behavior: 'smooth' })">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Watch the 2-minute demo
        </button>
      </div>
    </div>

    <div class="ilp-hero__visual reveal-fade">
      <div class="ilp-hero__image-wrapper">
        <img
          data-src="/assets/img/pages/how-it-works/how-it-works_3.jpg?nf_resize=fit&w=1000"
          src="/assets/img/pages/how-it-works/how-it-works_3.jpg?nf_resize=fit&w=200"
          alt="An AirBeam Mini and a phone showing the AirCasting app on a colorful picnic blanket, beside bread, cheese and fruit"
          class="lazyload ilp-hero__image" />
      </div>
    </div>
  </div>
</section>
