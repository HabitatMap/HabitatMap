<!--
  "Learn more about AirBeam Mini" banner for blog posts (A/B variant: learn_more).
  Low-friction alternative to the add-to-cart card: sends readers to /airbeam.
  The whole banner is a single link. Styles: _sass/modules/_airbeam-mini-banner.scss
-->
<div id="airbeam-mini-banner" class="airbeam-banner">
  <a class="airbeam-banner__card" href="/airbeam">
    <img
      class="airbeam-banner__img lazyload"
      data-src="/assets/buy-it-now_ABMsidebyside.jpg?nf_resize=fit&w=300"
      src="/assets/buy-it-now_ABMsidebyside.jpg?nf_resize=fit&w=60"
      alt="AirBeam Mini air quality monitor"
    />
    <span class="airbeam-banner__text">
      <span class="airbeam-banner__eyebrow">New to AirBeam?</span>
      <span class="airbeam-banner__title">Learn more about the AirBeam Mini</span>
      <span class="airbeam-banner__desc">A palm-sized monitor that tracks the PM2.5 you are actually breathing, in real time.</span>
    </span>
    <span class="airbeam-banner__arrow">Explore &rarr;</span>
  </a>
</div>
