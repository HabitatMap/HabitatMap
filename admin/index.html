<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Include the script that builds the page and powers Netlify CMS -->
    <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
    <script>
      /*
       * Custom body-image block with an Alt text field.
       * In the Body editor, click the "+" (add component) button and pick
       * "Image (with alt text)": choose an image from the media library and
       * type a description. It inserts standard markdown: ![alt](image-path).
       */
      CMS.registerEditorComponent({
        id: "image-alt",
        label: "Image (with alt text)",
        fields: [
          { name: "src", label: "Image", widget: "image" },
          {
            name: "alt",
            label: "Alt text",
            widget: "string",
            required: false,
            hint: "Describe the image for screen readers and search engines. Leave blank only for purely decorative images.",
          },
        ],
        pattern: /^!\[(.*)\]\((.*)\)$/,
        fromBlock: function (match) {
          return { alt: match[1], src: match[2] };
        },
        toBlock: function (obj) {
          return "![" + (obj.alt || "") + "](" + (obj.src || "") + ")";
        },
        toPreview: function (obj) {
          return '<img src="' + (obj.src || "") + '" alt="' + (obj.alt || "") + '" />';
        },
      });
    </script>
  </body>
</html>
